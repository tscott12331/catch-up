services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catch_up}
      POSTGRES_USER: ${POSTGRES_USER:-catch_up}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catch_up}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - catch_up_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  catch_up_postgres_data:
